description: >-
  COMSOL is a Swedish-American engineering software company best known for COMSOL Multiphysics,
  a desktop platform for physics-based simulation. The platform exposes a unified COMSOL API
  that powers the GUI, the Application Builder (Java-based Method Editor), LiveLink for MATLAB,
  LiveLink for Excel, and the LiveLink family of CAD/CAE interfacing products
  (SOLIDWORKS, Inventor, AutoCAD, Revit, Solid Edge, CATIA V5, MATLAB, Simulink, Excel). COMSOL
  is primarily licensed desktop software with web deployment via COMSOL Server and standalone
  applications via COMSOL Compiler. There is no public web REST API and no public GitHub SDK
  organization; programmatic surfaces are the Java API, the MATLAB LiveLink interface, and the
  module-specific LiveLink integrations bundled with the licensed product.
